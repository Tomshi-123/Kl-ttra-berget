<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klättra Berget – mattespel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", system-ui, sans-serif; }
  body { background: linear-gradient(#0b1e3a 0%, #274b7a 55%, #a9c6e3 100%); color: #10223d; }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .trees { position: fixed; left: 0; right: 0; bottom: 0; height: 32vh; z-index: 1; }
  .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 9vh; background: #eef5fc; z-index: 2; }
  #mountain { position: fixed; right: 0; bottom: 0; height: 92vh; width: 60vw; z-index: 3; }
  .panel {
    position: fixed; left: 4vw; top: 50%; transform: translateY(-50%); z-index: 10;
    width: min(380px, 38vw); background: rgba(255,255,255,.93); border-radius: 20px;
    padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center;
  }
  .panel h1 { font-size: 1.7rem; color: #1b3a66; margin-bottom: 4px; }
  .level { font-weight: bold; color: #c0392b; margin-bottom: 6px; }
  .progress { font-size: .9rem; color: #54657d; margin-bottom: 18px; }
  .question { font-size: 2.4rem; font-weight: bold; margin-bottom: 18px; }
  input { font-size: 1.8rem; width: 150px; text-align: center; padding: 8px; border: 3px solid #9bb4d3; border-radius: 12px; outline: none; }
  input:focus { border-color: #1b3a66; }
  button { display: block; margin: 16px auto 0; font-size: 1.2rem; padding: 12px 28px; border: 0; border-radius: 12px; background: #1b3a66; color: #fff; cursor: pointer; font-weight: bold; }
  button:hover { background: #2c5591; }
  .feedback { min-height: 1.5em; margin-top: 12px; font-weight: bold; }
  .timer { position: fixed; top: 18px; right: 22px; z-index: 10; background: rgba(255,255,255,.9); padding: 8px 16px; border-radius: 12px; font-size: 1.3rem; font-weight: bold; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateY(-50%)} 25%{transform:translate(-10px,-50%)} 75%{transform:translate(10px,-50%)} }
  #climber { transition: transform .8s ease-in-out; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<svg class="trees" viewBox="0 0 1000 300" preserveAspectRatio="none" id="trees"></svg>
<div class="ground"></div>

<svg id="mountain" viewBox="0 0 600 600" preserveAspectRatio="xMaxYMax meet">
  <polygon points="20,600 500,60 600,160 600,600" fill="#2b3f5c" />
  <polygon points="500,60 455,110 475,120 500,100 525,125 545,110" fill="#f4f8fc" />
  <path id="ridge" d="M 40 580 L 130 490 L 190 455 L 260 360 L 320 330 L 380 230 L 430 190 L 500 62"
        fill="none" stroke="#e3ecf6" stroke-width="3" stroke-dasharray="6 6" />
  <g id="flags"></g>
  <g id="climber">
    <!-- Klättraren, fötterna vid (0,0) -->
    <g transform="translate(0,-4)">
      <rect x="-4" y="-22" width="4" height="22" fill="#1d2b44" transform="rotate(-10)"/>
      <rect x="2" y="-22" width="4" height="22" fill="#1d2b44" transform="rotate(10)"/>
      <rect x="-9" y="-46" width="18" height="26" rx="5" fill="#d94a3d"/>
      <rect x="-15" y="-44" width="8" height="20" rx="3" fill="#e0a526"/>
      <circle cx="0" cy="-54" r="8" fill="#f2c9a0"/>
      <path d="M -9 -56 Q 0 -70 9 -56 Z" fill="#2a6fb0"/>
      <circle cx="0" cy="-66" r="3" fill="#fff"/>
      <line x1="9" y1="-40" x2="20" y2="-12" stroke="#6b4a2b" stroke-width="3"/>
    </g>
  </g>
</svg>

<div class="timer" id="timer">⏱ 0:00</div>

<div class="panel" id="panel">
  <div id="game">
    <h1>Klättra Berget</h1>
    <div class="level" id="level"></div>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <input id="answer" type="number" inputmode="numeric" autocomplete="off" />
    <button id="submit">Svara</button>
    <div class="feedback" id="feedback"></div>
  </div>
  <div id="done" class="hidden">
    <h1>🏔️ Du nådde toppen!</h1>
    <p style="margin:14px 0 4px">Din tid:</p>
    <div class="question" id="finalTime"></div>
    <button id="again">Kör igen</button>
  </div>
</div>

<script>
const trees = document.getElementById("trees");
let t = "";
for (let i = 0; i < 26; i++) {
  const x = i * 40 + Math.random() * 20, h = 120 + Math.random() * 130;
  t += `<polygon points="${x},300 ${x+28},${300-h} ${x+56},300" fill="#16324f"/>`;
  t += `<polygon points="${x+14},${300-h*0.55} ${x+28},${300-h} ${x+42},${300-h*0.55}" fill="#e8f1fa"/>`;
}
trees.innerHTML = t;

const c = document.getElementById("snow"), ctx = c.getContext("2d");
let flakes = [];
function resize() { c.width = innerWidth; c.height = innerHeight; }
resize(); addEventListener("resize", resize);
for (let i = 0; i < 160; i++) flakes.push({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, r: 1+Math.random()*3, s: .5+Math.random()*1.5, d: Math.random()*6 });
(function snow() {
  ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle = "rgba(255,255,255,.9)";
  for (const f of flakes) {
    f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .5;
    if (f.y > c.height) { f.y = -5; f.x = Math.random()*c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(snow);
})();

const TOTAL = 30;
const ridge = document.getElementById("ridge");
const len = ridge.getTotalLength();
function pointAt(step) { return ridge.getPointAtLength(len * step / TOTAL); }

const flagColors = ["#27ae60", "#f39c12", "#c0392b"];
const flagData = [
  { step: 10, label: "Tiokompisar" },
  { step: 20, label: "Hundrakompisar" },
  { step: 30, label: "MÅL" }
];

let fl = "";
flagData.forEach((fInfo, i) => {
  const p = pointAt(fInfo.step);
  fl += `<g transform="translate(${p.x},${p.y})">
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#eee" stroke-width="3"/>
    <polygon points="0,-44 38,-36 0,-28" fill="${flagColors[i]}"/>
    <text x="6" y="-36" font-size="11" font-weight="bold" fill="#fff">${fInfo.label}</text>
  </g>`;
});
document.getElementById("flags").innerHTML = fl;

const climber = document.getElementById("climber");
function moveClimber(step) {
  const p = pointAt(step);
  climber.setAttribute("transform", `translate(${p.x},${p.y}) scale(1.3)`);
}

const levels = [
  { name: "Tiokompisar", target: 10, make: () => Math.floor(Math.random() * 9) + 1 },
  { name: "Hundrakompisar", target: 100, make: () => (Math.floor(Math.random() * 9) + 1) * 10 },
  { name: "Tusenkompisar", target: 1000, make: () => (Math.floor(Math.random() * 9) + 1) * 100 }
];

let step, current, startTime, timerId;
const $ = id => document.getElementById(id);

function fmt(ms) { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function newQuestion() {
  const lvlIndex = Math.min(Math.floor(step / 10), 2);
  const lvl = levels[lvlIndex];
  current = { a: lvl.make(), target: lvl.target };
  $("level").textContent = lvl.name;
  $("progress").textContent = `Fråga ${step % 10 + 1} av 10 · Totalt ${step}/${TOTAL}`;
  $("question").textContent = `${current.a} + ? = ${current.target}`;
  $("answer").value = ""; $("answer").focus();
}

function check() {
  const v = Number($("answer").value);
  if ($("answer").value === "") return;
  if (current.a + v === current.target) {
    step++; moveClimber(step);
    $("feedback").style.color = "#27ae60";
    if (step === 10) {
      $("feedback").textContent = "Tiokompisar avklarat! 🚩";
    } else if (step === 20) {
      $("feedback").textContent = "Hundrakompisar avklarat! 🚩";
    } else if (step >= TOTAL) {
      return finish();
    } else {
      $("feedback").textContent = "Rätt! ⛏️";
    }
    if (step >= TOTAL) return finish();
    newQuestion();
  } else {
    $("feedback").style.color = "#c0392b"; $("feedback").textContent = "Försök igen!";
    const p = $("panel"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
  }
}

function finish() {
  clearInterval(timerId);
  $("finalTime").textContent = fmt(Date.now() - startTime);
  $("game").classList.add("hidden"); $("done").classList.remove("hidden");
}

function start() {
  step = 0; moveClimber(0);
  $("feedback").textContent = "";
  $("game").classList.remove("hidden"); $("done").classList.add("hidden");
  startTime = Date.now(); clearInterval(timerId);
  timerId = setInterval(() => $("timer").textContent = "⏱ " + fmt(Date.now() - startTime), 250);
  newQuestion();
}

$("submit").onclick = check;
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("again").onclick = start;
start();
</script>
</body>
</html>
